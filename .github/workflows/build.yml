name: build

on:
  push:
    branches: [main]
    paths:
      - "enrollment/**"
      - "freeradius/**"
      - "step-ca/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "enrollment/**"
      - "freeradius/**"
      - "step-ca/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tag is the version of the component; bump it with every change of the build context.
          - {name: wifi-enrollment, context: enrollment, tag: "1.1.5"}
          - {name: wifi-freeradius, context: freeradius, tag: "3.2.10-r5"}
          - {name: wifi-step-ca, context: step-ca, tag: "0.30.2-unprivileged"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The enrollment Dockerfile runs gofmt and go test in its build stage: a failing test fails the build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
